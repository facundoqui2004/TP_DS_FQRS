services:
  # 1. Base de datos MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: metahumano-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metahumano
      MYSQL_USER: dsw
      MYSQL_PASSWORD: dsw
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - metahumano-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dsw", "-pdsw"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. Adminer - Gestor visual de base de datos
  adminer:
    image: adminer:latest
    container_name: metahumano-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - metahumano-network
    depends_on:
      - mysql

  # 3. Backend API (Node.js + Express + TypeScript + MikroORM)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: metahumano-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: supergestor_secret_key_jwt_token_2026
      JWT_EXPIRES_IN: 24h
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: metahumano
      DB_USER: dsw
      DB_PASSWORD: dsw
    volumes:
      - ./Backend:/app
    networks:
      - metahumano-network
    depends_on:
      mysql:
        condition: service_healthy

  # 4. Frontend SPA (React + Vite + TailwindCSS)
  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
    container_name: metahumano-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:3000/api
      VITE_APP_TITLE: El Súper Gestor
      VITE_APP_ENV: development
    volumes:
      - ./Front:/app
    networks:
      - metahumano-network
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  metahumano-network:
    driver: bridge
